name: Robot Cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      ROBOT_API_KEY: ${{ secrets.ROBOT_API_KEY }}
      EMITENTE_CNPJ: ${{ secrets.EMITENTE_CNPJ }}
      EMITENTE_COD_MUNICIPIO: ${{ secrets.EMITENTE_COD_MUNICIPIO }}
      EMITENTE_INSCRICAO_MUNICIPAL: ${{ secrets.EMITENTE_INSCRICAO_MUNICIPAL }}
      CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      NFSE_AMBIENTE: ${{ secrets.NFSE_AMBIENTE }}
      NFSE_SERIE: ${{ secrets.NFSE_SERIE }}
      NFSE_CODIGO_SERVICO: ${{ secrets.NFSE_CODIGO_SERVICO }}
      NFSE_ALIQ_ISS: ${{ secrets.NFSE_ALIQ_ISS }}
      NFSE_PTOTTRIBSN: ${{ secrets.NFSE_PTOTTRIBSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify Node version
        run: node -v

      - name: Run robot (all pending notes)
        run: npm run robot:run
